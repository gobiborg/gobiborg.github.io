<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOBIBORG | Motion Graphics Designer in Tech</title>
<style>
/* Modern CSS Reset & Variable Setup */
:root {
  --bg-color: #0a0a0a;
  --text-main: #ffffff;
  --text-muted: #888888;
  --text-body: #b3b3b3;
  --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  
  /* High-Saturate Vibrant UI Palette */
  --google-blue: #2f7fff;
  --google-purple: #a13eff;
  --google-red: #ff3b30;
  --google-orange: #ff9500;
  --google-yellow: #ffcc00;
  --google-green: #34c759;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  background-color: var(--bg-color);
  color: var(--text-main);
  font-family: var(--font-stack);
  min-height: 100vh;
  min-height: 100dvh;
  width: 100%;
  overflow-x: hidden;
  overflow-y: auto;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2.5rem 2rem;
}

/* Container & Entrance Animation */
.container {
  max-width: 600px;
  width: 100%;
  opacity: 0;
  transform: translateY(20px);
  animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  display: flex;
  flex-direction: column;
  gap: 2.5rem;
}

/* Centered Header Block */
.header-block {
  text-align: center;
  width: 100%;
  perspective: 600px; /* Enables clean 3D transforms for WordArt */
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

h1 {
  font-size: clamp(3rem, 10vw, 5.5rem); 
  font-weight: 900;
  letter-spacing: -0.04em; 
  line-height: 0.9;
  margin-bottom: 0.75rem;
  text-transform: uppercase;
  transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  display: inline-block;

  /* Restored structural layout with the updated Playful/Vibrant Radial Engine */
  background: radial-gradient(
    circle at 20% 30%,
    var(--google-blue) 0%,
    var(--google-purple) 20%,
    var(--google-red) 40%,
    var(--google-orange) 60%,
    var(--google-yellow) 80%,
    var(--google-green) 100%
  );
  background-size: 260% 260%;
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
  -webkit-text-fill-color: transparent;
  animation: googleFluidWave 12s ease-in-out infinite;
}

/* ==========================================
   THE ULTIMATE RETRO WORDART EXPANSION
   ========================================== */

/* 1. The Rainbow Arch (The Absolute Classic) */
h1.wa-rainbow {
  font-family: "Impact", "Arial Black", sans-serif;
  background: linear-gradient(to right, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff);
  background-clip: text; -webkit-background-clip: text;
  color: transparent; -webkit-text-fill-color: transparent;
  -webkit-text-stroke: 1.5px #000000;
  filter: drop-shadow(3px 3px 0px rgba(0,0,0,0.8));
  transform: scaleY(1.2) skewX(-10deg) rotate(-3deg);
  animation: none; letter-spacing: 0.05em;
}

/* 2. The Blue 3D Extrusion */
h1.wa-blue3d {
  font-family: "Impact", "Arial Black", sans-serif;
  background: linear-gradient(to bottom, #66ccff, #0033cc);
  background-clip: text; -webkit-background-clip: text;
  color: transparent; -webkit-text-fill-color: transparent;
  -webkit-text-stroke: 1px #000033;
  transform: rotateX(25deg) rotateY(-20deg) rotateZ(-5deg);
  animation: none;
  text-shadow: 
    1px 1px 0px #001f80, 2px 2px 0px #001f80, 3px 3px 0px #001f80,
    4px 4px 0px #001f80, 5px 5px 0px #001f80, 6px 6px 6px rgba(0,0,0,0.9);
}

/* 3. Silver Horizontal Outline & Cast Shadow */
h1.wa-silver {
  font-family: "Arial Black", sans-serif;
  font-style: italic;
  background: linear-gradient(to bottom, #ffffff 0%, #a6a6a6 50%, #ffffff 100%);
  background-clip: text; -webkit-background-clip: text;
  color: transparent; -webkit-text-fill-color: transparent;
  -webkit-text-stroke: 1.5px #444444;
  transform: skewX(-15deg); animation: none;
  filter: drop-shadow(-6px 6px 1px rgba(0,0,0,0.7));
}

/* 4. Flame Gradient with Bottom Block Shadow */
h1.wa-flame {
  font-family: "Impact", sans-serif;
  background: linear-gradient(to bottom, #ffff00, #ff3300);
  background-clip: text; -webkit-background-clip: text;
  color: transparent; -webkit-text-fill-color: transparent;
  -webkit-text-stroke: 1px #330000;
  transform: scale(1.1) translateY(-5px); animation: none;
  filter: drop-shadow(0px 7px 0px #4a0000);
}

/* 5. Pink/Purple Neon Slant */
h1.wa-neon {
  font-family: "Times New Roman", Times, serif;
  font-weight: bold;
  font-style: italic;
  background: linear-gradient(135deg, #ff00ff, #6600cc);
  background-clip: text; -webkit-background-clip: text;
  color: transparent; -webkit-text-fill-color: transparent;
  -webkit-text-stroke: 1px #ffccff;
  transform: skewY(-6deg) rotate(-2deg) scaleX(0.9); animation: none;
  filter: drop-shadow(4px 4px 0px #220033);
  letter-spacing: 0.08em;
}

/* 6. Desert Gold Invert Arch */
h1.wa-gold {
  font-family: "Copperplate", "Arial Black", sans-serif;
  background: linear-gradient(to bottom, #2b1d0c 0%, #d4af37 40%, #ffffff 50%, #aa7c11 60%, #4a3206 100%);
  background-clip: text; -webkit-background-clip: text;
  color: transparent; -webkit-text-fill-color: transparent;
  -webkit-text-stroke: 1.2px #111;
  transform: perspective(400px) rotateX(-15deg) scaleY(1.1); animation: none;
  filter: drop-shadow(3px 4px 2px rgba(0,0,0,0.8));
}

/* 7. Bright Lime Green Outline Wireframe */
h1.wa-lime {
  font-family: "Comic Sans MS", "Arial Black", sans-serif;
  background: none;
  color: #000000;
  -webkit-text-fill-color: #000000;
  -webkit-text-stroke: 2px #00ff00;
  transform: rotate(4deg) scale(0.95); animation: none;
  filter: drop-shadow(4px 4px 0px #003300);
}

/* 8. Retro Corporate Shadow (Tilted Semi-Transparent) */
h1.wa-corporate {
  font-family: "Arial Black", sans-serif;
  background: #ffffff;
  background-clip: text; -webkit-background-clip: text;
  color: transparent; -webkit-text-fill-color: transparent;
  -webkit-text-stroke: 1px #888888;
  transform: rotateX(15deg) skewX(12deg); animation: none;
  text-shadow: 
    -1px 1px 0px #444, -2px 2px 0px #444, -3px 3px 0px #333,
    -4px 4px 4px rgba(0,0,0,0.6);
}

/* 9. The Mythic Vertical WordArt */
h1.wa-vertical {
  font-family: "Impact", "Arial Black", sans-serif;
  background: linear-gradient(to bottom, #00ffff, #00008b);
  background-clip: text; -webkit-background-clip: text;
  color: transparent; -webkit-text-fill-color: transparent;
  -webkit-text-stroke: 1px #000033;
  animation: none;
  letter-spacing: -0.05em;
  line-height: 0.85;
  font-size: clamp(2.5rem, 8vw, 4rem);
  transform: rotateY(15deg);
  filter: drop-shadow(5px 2px 0px rgba(0,0,0,0.7));
  margin-bottom: 1.5rem;
}

h3 {
  font-size: clamp(0.95rem, 3.8vw, 1.25rem);
  font-weight: 400;
  color: var(--text-muted);
  letter-spacing: 0.02em; 
  line-height: 1.4;
  text-transform: lowercase;
  transition: margin-top 0.3s ease;
}

/* Body Copy Styling */
.content-block {
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
}

p {
  font-size: clamp(0.9rem, 3.5vw, 1.05rem); 
  font-weight: 400;
  color: var(--text-body);
  letter-spacing: -0.01em;
  line-height: 1.5;
}

.feature-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  padding-left: 0;
}

.feature-list li {
  font-size: clamp(0.9rem, 3.5vw, 1.05rem);
  color: var(--text-body);
  line-height: 1.5;
